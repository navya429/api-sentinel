services:
  db:
    image: postgres:16
    container_name: api-sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: api_sentinel
      POSTGRES_USER: api_sentinel_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_sentinel_user -d api_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
